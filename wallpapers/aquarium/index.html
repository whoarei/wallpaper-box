<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102f32">
<title data-i18n="静水之间 · Stillwater Aquarium">静水之间 · Stillwater Aquarium</title>
<link rel="stylesheet" href="./aquarium.css">
<script src="./translations.js" defer></script><script src="./i18n.js" defer></script><script src="./wallpaper-adapter.js" defer></script>
<script src="./aquarium.js" defer></script>
</head>
<body>
<canvas id="aquarium" width="1600" height="1000" role="img" aria-label="动态水族箱：三十尾鱼在水草与沉木间游动，点击水面可以投喂。" data-i18n-aria-label="动态水族箱：三十尾鱼在水草与沉木间游动，点击水面可以投喂。"></canvas>
<header class="hud brand"><div class="brand-mark" aria-hidden="true">≈</div><div><h1 data-i18n="静水之间">静水之间</h1><p>STILLWATER AQUARIUM</p></div></header>
<div class="hud clock"><time id="time">--:--</time><span id="date"></span></div>
<div class="hud caption"><p><span></span><span data-i18n="让时间，像水一样流过。">让时间，像水一样流过。</span></p><small data-i18n="30 尾鱼儿 · 一方安静">30 尾鱼儿 · 一方安静</small></div>
<nav class="hud controls" aria-label="水族箱控制" data-i18n-aria-label="水族箱控制">
 <button id="feed" title="投喂（空白处点击，或按 E）" data-i18n-title="投喂（空白处点击，或按 E）"><span aria-hidden="true">⌁</span><b data-i18n="投喂">投喂</b></button>
 <button id="light" title="切换晨光、暮色与月光（L）" data-i18n-title="切换晨光、暮色与月光（L）"><span aria-hidden="true">◒</span><b id="light-label" data-i18n="晨光">晨光</b></button>
 <button id="flow" title="切换水流（C）" data-i18n-title="切换水流（C）"><span aria-hidden="true">≋</span><b id="flow-label" data-i18n="缓流">缓流</b></button>
 <span class="divider" aria-hidden="true"></span>
 <button id="pause" title="暂停 / 继续（空格）" aria-pressed="false" data-i18n-title="暂停 / 继续（空格）"><span id="pause-icon" aria-hidden="true">Ⅱ</span><b id="pause-label" data-i18n="暂停">暂停</b></button>
 <button id="fullscreen" title="全屏（F）；浏览器也可以使用 F11" data-i18n-title="全屏（F）；浏览器也可以使用 F11"><span aria-hidden="true">⛶</span><b data-i18n="全屏">全屏</b></button>
 <button id="help" class="help-button" title="互动说明（H）" aria-expanded="false" data-i18n-title="互动说明（H）">?</button>
</nav>
<div class="hud hint" data-i18n="点击水面投喂 · H 互动说明">点击水面投喂 · H 互动说明</div>
<aside id="help-panel" class="help-panel" hidden><button id="close-help" aria-label="关闭说明" data-i18n-aria-label="关闭说明">×</button><h2 data-i18n="在水里，慢一点。">在水里，慢一点。</h2><p><span data-i18n="点击水面，鱼儿会游来吃东西。">点击水面，鱼儿会游来吃东西。</span><br><span data-i18n="停留片刻，看看它们自己漫游。">停留片刻，看看它们自己漫游。</span></p><dl><dt>E</dt><dd data-i18n="投下一小撮鱼食">投下一小撮鱼食</dd><dt>L</dt><dd data-i18n="晨光 / 暮色 / 月光">晨光 / 暮色 / 月光</dd><dt>C</dt><dd data-i18n="切换水流强度">切换水流强度</dd><dt data-i18n="空格">空格</dt><dd data-i18n="暂停 / 继续">暂停 / 继续</dd><dt>S</dt><dd data-i18n="隐藏 / 显示界面">隐藏 / 显示界面</dd><dt>F</dt><dd data-i18n="网页全屏">网页全屏</dd><dt>H</dt><dd data-i18n="这份说明">这份说明</dd></dl><p class="muted"><span data-i18n="移动鼠标即可唤回控制栏。">移动鼠标即可唤回控制栏。</span><br><span data-i18n="F11 进入或退出浏览器全屏。">F11 进入或退出浏览器全屏。</span></p></aside>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="pause-badge" class="pause-badge" hidden><span data-i18n="水下的时间，暂停片刻。">水下的时间，暂停片刻。</span><small data-i18n="按空格继续">按空格继续</small></div>
</body>
</html>
