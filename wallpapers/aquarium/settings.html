<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="静水之间 · 壁纸设置">静水之间 · 壁纸设置</title>
<link rel="stylesheet" href="/__wallpaper_host__/settings.css"><script src="translations.js" defer></script><script src="i18n.js" defer></script><script src="/__wallpaper_host__/settings.js" defer></script></head>
<body><form id="settings-form" class="settings-form"><div class="settings-scroll"><fieldset id="fields" disabled>
<label class="settings-row" for="lighting"><span data-i18n="光照">光照</span><select id="lighting"><option value="0" data-i18n="晨光">晨光</option><option value="1" data-i18n="暮色">暮色</option><option value="2" data-i18n="月光">月光</option></select></label>
<label class="settings-row" for="flow"><span data-i18n="水流">水流</span><select id="flow"><option value="0" data-i18n="缓流">缓流</option><option value="1" data-i18n="轻涌">轻涌</option><option value="2" data-i18n="静水">静水</option></select></label>
</fieldset></div>
<footer class="settings-actions"><div class="settings-feedback"><p id="feedback" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p></div><div class="settings-buttons"><button type="button" id="defaults" disabled data-i18n="恢复默认">恢复默认</button><button type="submit" id="save" disabled data-i18n="保存更改">保存更改</button></div></footer>
</form>
<script>
window.addEventListener('DOMContentLoaded',()=>{
 'use strict';
 const $=id=>document.getElementById(id),i18n=window.wallpaperI18n;let revision=0,loaded=false,feedbackKey='',errorKey='';
 function busy(value){$('fields').disabled=value;$('defaults').disabled=value;$('save').disabled=value;}
 function feedback(key){feedbackKey=key;$('feedback').textContent=i18n.t(key);}
 function localize(){i18n.setLocale(wallpaperSettings.locale);i18n.apply();feedback(feedbackKey);if(errorKey)$('error').textContent=i18n.message(errorKey);}
 window.addEventListener('wallpapersettings:localechange',localize);
 function fill(settings){
 $('lighting').value=String(Number.isInteger(settings.lighting)&&settings.lighting>=0&&settings.lighting<3?settings.lighting:0);
 $('flow').value=String(Number.isInteger(settings.flow)&&settings.flow>=0&&settings.flow<3?settings.flow:0);
 }
 function failure(error){errorKey=String(error.message||error);$('error').textContent=i18n.message(errorKey);$('error').hidden=false;}
 async function load(){
  try{const snapshot=await wallpaperSettings.load();revision=snapshot.revision;fill(snapshot.settings);localize();loaded=true;busy(false);}
  catch(error){failure(error);}
 }
 $('fields').addEventListener('change',()=>feedback('更改尚未保存'));
 $('defaults').onclick=()=>{fill({"lighting": 0, "flow": 0});feedback('已恢复默认选项，保存后生效。');};
 $('settings-form').onsubmit=async event=>{
  event.preventDefault();if(!loaded||$('fields').disabled)return;
  busy(true);$('error').hidden=true;feedback('正在保存…');
  try{const result=await wallpaperSettings.save({lighting:Number($('lighting').value),flow:Number($('flow').value)},revision);revision=result.snapshot.revision;
   feedback(result.pending?'已保存，部分窗口将在就绪后同步。':result.running?'已保存，已通知正在运行的壁纸。':'已保存，将在壁纸下次启动时生效。');}
  catch(error){feedback('');failure(error);}
  finally{busy(false);}
 };
 load();
});
</script></body></html>
