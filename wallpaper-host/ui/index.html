<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>壁纸盒子 · 壁纸管理</title><link rel="stylesheet" href="app.css"><script src="app.js" defer></script></head>
<body>
<header><div class="brand"><span class="mark">≈</span><div><strong>壁纸盒子</strong><small>WALLPAPER BOX</small></div><span id="version" class="version">0.2.1</span></div><div class="header-actions"><span class="service online"><i></i>本地播放 · 离线可用</span></div></header>
<main>
<section class="intro"><div><p class="eyebrow">A LITTLE WORLD, ON YOUR DESKTOP.</p><h1>让桌面，留一处风景。</h1><p class="lead">选择显示器，再选一张喜欢的壁纸。</p></div><div class="intro-actions"><button id="show-desktop" class="quiet tray-hide">查看桌面</button><button id="hide" class="quiet tray-hide">收起到托盘 ↘</button></div></section>
<div id="error" class="error" role="alert" hidden></div>
<section class="display-section"><div class="section-label"><h2>显示位置</h2><label class="switch-label"><input id="auto-pause" type="checkbox" checked><span>被窗口遮挡时自动暂停</span></label></div><div id="displays" class="displays" aria-label="选择显示器"></div></section>
<section class="current"><div><span class="status-dot" id="status-dot"></span><strong id="current-title">正在读取壁纸</strong><span id="current-status"></span></div><div class="current-actions"><button id="feed-aquarium" class="quiet" title="向当前屏幕的水族箱投下一小撮鱼食" hidden>投喂鱼儿</button><button id="pause" class="quiet" disabled>暂停</button><button id="preview" class="quiet">保存桌面预览</button><button id="remove" class="quiet" disabled>关闭该屏幕壁纸</button></div></section>
<div id="transfer" class="transfer" role="status" hidden><span id="transfer-label"></span><progress id="transfer-progress" max="100" value="0"></progress><span id="transfer-size"></span></div>
<nav class="tabs" aria-label="壁纸来源"><button id="tab-local" class="tab selected" aria-pressed="true">我的壁纸 <span id="module-count">02</span></button><button id="tab-online" class="tab" aria-pressed="false">在线壁纸 <span id="update-count"></span></button></nav>
<section id="local-panel"><div class="collection-actions"><span id="target-label" class="target-label"></span><div><button id="open-folder" class="quiet">打开壁纸目录</button><button id="import-folder" class="quiet">导入文件夹</button><button id="import-zip" class="quiet">导入 ZIP</button><button id="refresh" class="quiet">刷新</button></div></div><div id="modules" class="modules"></div><p id="empty" class="empty" hidden>把壁纸文件夹放入自定义目录，或到在线壁纸库按需下载。</p><details id="warnings-box" class="warnings" hidden><summary>部分壁纸未能载入</summary><ul id="warnings"></ul></details></section>
<section id="online-panel" hidden><div class="online-heading"><div><h2>官方壁纸库</h2><p>只下载你选择的壁纸，下载后离线也能播放。</p><small>GitHub · whoarei/wallpapers</small></div><button id="check-online" class="quiet">检查更新</button></div><p id="online-status" class="online-status">检查清单即可浏览，不会自动下载壁纸包。</p><div id="online-error" class="error" role="alert" hidden></div><div id="online-modules" class="modules"></div><p id="online-empty" class="empty">点击“检查更新”，看看有哪些新壁纸。</p></section>
</main>
<footer><span>关闭窗口后，仍可从系统托盘切换壁纸。</span><button id="quit" class="text-button">退出程序</button></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body></html>
