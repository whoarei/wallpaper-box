[package]
name = "screen-garden"
version = "0.3.1"
description = "Wallpaper Box desktop wallpaper host"
edition = "2021"
default-run = "wallpaper-box"

[[bin]]
name = "wallpaper-box"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
zip = { version = "=9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10"
semver = "1"
percent-encoding = "2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
png = "0.18"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Accessibility"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = "s"
codegen-units = 8
