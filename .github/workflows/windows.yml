name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wallpaper-host/package-lock.json
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.95.0
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
        with:
          workspaces: wallpaper-host/src-tauri -> target
          cache-on-failure: true
      - name: Install pinned Tauri CLI
        working-directory: wallpaper-host
        run: npm ci --ignore-scripts
      - name: Verify signed update release tooling
        run: node --test ./wallpaper-host/scripts/release.test.mjs
      - name: Validate version, JavaScript, and module discovery
        run: |
          node wallpaper-host/scripts/check-version.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check wallpaper-host/ui/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test display-service/tests/registry.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --check --manifest-path wallpaper-host/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows NSIS installer
        working-directory: wallpaper-host
        run: npm run bundle
      - name: Verify manager flows and actual wallpaper interactions
        working-directory: wallpaper-host
        run: |
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:aquarium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:pinewind
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Rust with release features
        run: cargo test --locked --release --features custom-protocol --manifest-path wallpaper-host/src-tauri/Cargo.toml
      - name: Package installer and sign update artifacts when authorized
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          $requireSigned = $env:GITHUB_REF -like 'refs/tags/v*'
          ./wallpaper-host/scripts/package-release.ps1 -OutputDirectory ./release -RequireSigned:$requireSigned
      - name: Verify actual installer payload matches the resource manifest
        run: |
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          node ./wallpaper-host/scripts/verify-installer.mjs ./release $sevenZip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wallpaper-box-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wallpaper-box-windows-x64
          path: release
      - name: Verify, upload, download-check, and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./.github/scripts/publish-release.ps1 -Tag $env:RELEASE_TAG -Directory ./release
