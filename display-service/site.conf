server {
    listen 8080;
    server_name _;
    # Keep redirects relative: the published host port differs from 8080.
    absolute_redirect off;
    charset utf-8;
    root /srv/modules;
    index index.html;
    autoindex off;
    disable_symlinks on;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"desktop-display"}\n';
    }

    location = / {
        rewrite ^ /index.html last;
    }

    location = /index.html {
        alias /srv/display/index.html;
        default_type text/html;
    }

    location /assets/ {
        root /srv/display;
        try_files $uri =404;
    }

    location = /api/modules {
        set $registry http://registry:3000;
        proxy_pass $registry;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
    }

    location /api/ {
        return 404;
    }

    location = /docs {
        return 302 /docs/architecture.html;
    }

    location = /docs/ {
        return 302 /docs/architecture.html;
    }

    location /docs/ {
        root /srv/display;
        try_files $uri =404;
    }

    # Only explicitly mounted public pages are available.
    location ~ /\. {
        return 404;
    }

    # Optional, explicit reverse-proxy routes belong here.
    include /etc/nginx/routes/*.conf;

    location / {
        try_files $uri $uri/ =404;
    }
}
